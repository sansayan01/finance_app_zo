name: Production Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  # Never cancel a production release halfway: a half-finished run can leave the
  # web app deployed while the GitHub release and APKs never appear.
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.x'
  JAVA_TOOL_OPTIONS: '-Xmx4096m'

jobs:
  merge-to-main:
    name: Merge Development → Main
    # Only on a real tag push. On a manual run the branch is already the source
    # of truth and this merge used to fail for no reason.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge development into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin development
          git merge origin/development --no-edit -m "chore: merge development into main for release"
          git push origin main
          echo "✅ Merged development → main successfully"

  validate-tag:
    name: Validate Tag
    needs: merge-to-main
    if: always() && (needs.merge-to-main.result == 'success' || needs.merge-to-main.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      build_number: ${{ steps.extract.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract version from tag and pubspec
        id: extract
        run: |
          set -euo pipefail

          # pubspec is the source of truth for the build number, because the
          # release tool bumps it there. A tag like v1.0.5 carries no +N, and
          # falling back to github.run_number produced a LOWER versionCode than
          # the previous release, which the Play Store rejects.
          PUBSPEC_FULL=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//' | tr -d '\r')
          PUB_VER="${PUBSPEC_FULL%%+*}"
          PUB_BUILD="${PUBSPEC_FULL##*+}"
          if [ "$PUB_BUILD" = "$PUBSPEC_FULL" ] || [ -z "$PUB_BUILD" ]; then
            PUB_BUILD=1
          fi
          echo "pubspec_version=$PUB_VER" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # workflow_dispatch: no tag exists yet, release what pubspec says.
            TAG="v${PUB_VER}"
            echo "::notice::Manual run, using pubspec version ${PUB_VER}"
          fi
          TAG="${TAG#v}"

          VERSION="${TAG%%+*}"
          BUILD="${TAG##*+}"
          if [ "$BUILD" = "$VERSION" ] || [ -z "$BUILD" ]; then
            BUILD="$PUB_BUILD"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (build $BUILD)"
      - name: Verify version matches pubspec.yaml
        run: |
          set -euo pipefail
          TAG_VERSION="${{ steps.extract.outputs.version }}"
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//' | cut -d+ -f1 | tr -d '\r')
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match pubspec.yaml version ($PUBSPEC_VERSION)"
            echo "Bump the version in pubspec.yaml (or re-tag) so the store sees the right build."
            exit 1
          fi
          echo "Version match confirmed: $TAG_VERSION"

  test:
    name: Test
    needs: merge-to-main
    if: always() && (needs.merge-to-main.result == 'success' || needs.merge-to-main.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare .env files
        run: |
          cp .env.example .env
          cp .env.example assets/.env
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool/
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter=github

  build-android:
    name: Build Android (Production)
    needs: [validate-tag, test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.validate-tag.outputs.version }}
      build_number: ${{ needs.validate-tag.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare .env files
        run: |
          cp .env.example .env
          cp .env.example assets/.env
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool/
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - run: flutter pub get

      - name: Increase Gradle heap for CI
        run: sed -i 's/-Xmx[0-9]*G/-Xmx6G/' android/gradle.properties

      - name: Decode Android Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
      - name: Decode Key Properties
        run: echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" | base64 --decode > android/key.properties

      - name: Build Signed APK (Universal)
        run: |
          flutter build apk --release \
            --build-number=${{ needs.validate-tag.outputs.build_number }} \
            --dart-define=SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.PROD_SUPABASE_ANON_KEY }}" \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --dart-define=POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}" \
            --dart-define=POSTHOG_HOST="${{ secrets.POSTHOG_HOST || 'https://app.posthog.com' }}" \
            --dart-define=MAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      - name: Build Split APKs (per architecture)
        run: |
          flutter build apk --release --split-per-abi \
            --build-number=${{ needs.validate-tag.outputs.build_number }} \
            --dart-define=SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.PROD_SUPABASE_ANON_KEY }}" \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --dart-define=POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}" \
            --dart-define=POSTHOG_HOST="${{ secrets.POSTHOG_HOST || 'https://app.posthog.com' }}" \
            --dart-define=MAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      - name: Build Signed AAB
        run: |
          flutter build appbundle --release \
            --build-number=${{ needs.validate-tag.outputs.build_number }} \
            --dart-define=SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.PROD_SUPABASE_ANON_KEY }}" \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --dart-define=POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}" \
            --dart-define=POSTHOG_HOST="${{ secrets.POSTHOG_HOST || 'https://app.posthog.com' }}" \
            --dart-define=MAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      - name: Prepare flat artifacts
        run: |
          mkdir -p build-artifacts
          # Universal APK (all architectures)
          cp build/app/outputs/flutter-apk/app-release.apk build-artifacts/
          # Split APKs (one per architecture)
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build-artifacts/ 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build-artifacts/ 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build-artifacts/ 2>/dev/null || true
          # AAB for Play Store
          cp build/app/outputs/bundle/release/app-release.aab build-artifacts/
          echo "Artifacts prepared:"
          ls -la build-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.ref_name }}
          path: build-artifacts/
          retention-days: 30

  deploy-web:
    name: Deploy Web (Production)
    needs: [validate-tag, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool/
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - name: Prepare .env files
        run: |
          cp .env.example .env
          cp .env.example assets/.env
      - run: flutter pub get
      - name: Build Web (Production)
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.PROD_SUPABASE_ANON_KEY }}" \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --dart-define=POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}" \
            --dart-define=POSTHOG_HOST="${{ secrets.POSTHOG_HOST || 'https://app.posthog.com' }}" \
            --dart-define=MAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}" \
            --dart-define=GOOGLE_REDIRECT_URI="https://microflow-442f8.web.app/"
      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseToken: ${{ secrets.FIREBASE_TOKEN }}
          projectId: microflow-442f8
          channelId: live
          entryPoint: ./

  db-migration:
    name: Migration Reminder
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # Migrations are applied by hand in the Supabase SQL editor, so this job
      # cannot verify them. It used to only print two echo lines, which gave
      # false confidence. Now it lists the migration files that shipped since
      # the previous tag and puts them in the run summary, so nothing is
      # forgotten before the APK goes out.
      - name: List migrations shipped in this release
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
            echo "No previous tag, listing every migration file."
          else
            RANGE="$PREV_TAG..HEAD"
            echo "Comparing against $PREV_TAG"
          fi

          FILES=$(git log --pretty=format: --name-only $RANGE -- 'supabase/migrations/*.sql' 'supabase/*.sql' | sort -u | grep -v '^$' || true)
          {
            echo "### Migrations added in this release"
            echo
            if [ -z "$FILES" ]; then
              echo "None."
            else
              echo 'Apply these in the Supabase SQL editor BEFORE shipping:'
              echo '```'
              echo "$FILES"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$FILES"

  publish-github-release:
    name: Create GitHub Release
    needs: [validate-tag, build-android]
    if: always() && (needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # On a tag push this equals the pushed tag; on a manual run it is built
      # from the pubspec version, because github.ref_name would be 'main'.
      RELEASE_TAG: v${{ needs.validate-tag.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-release-${{ github.ref_name }}
          path: release-artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Release ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          make_latest: true
          files: |
            release-artifacts/app-release.apk
            release-artifacts/app-arm64-v8a-release.apk
            release-artifacts/app-armeabi-v7a-release.apk
            release-artifacts/app-x86_64-release.apk
            release-artifacts/app-release.aab
      - name: Remove auto-generated source archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${RELEASE_TAG}"
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq '.id')
          if [ -n "$RELEASE_ID" ]; then
            ASSETS=$(gh api repos/${{ github.repository }}/releases/$RELEASE_ID/assets --jq '.[] | select(.name | test("\\.(zip|tar\\.gz)$")) | .id')
            for ASSET_ID in $ASSETS; do
              ASSET_NAME=$(gh api repos/${{ github.repository }}/releases/$RELEASE_ID/assets/$ASSET_ID --jq '.name')
              echo "Removing auto-generated asset: $ASSET_NAME"
              gh api -X DELETE repos/${{ github.repository }}/releases/$RELEASE_ID/assets/$ASSET_ID
            done
          fi
