name: Production Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.x'

jobs:
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      build_number: ${{ steps.extract.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version from tag
        id: extract
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Build version: $TAG"
          if [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\+([0-9]+)$ ]]; then
            echo "build_number=${BASH_REMATCH[4]}" >> "$GITHUB_OUTPUT"
            echo "Build number: ${BASH_REMATCH[4]}"
          else
            echo "WARNING: Tag doesn't match version+build format (x.y.z+N)"
          fi
      - name: Verify version matches pubspec.yaml
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PUBSPEC_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match pubspec.yaml version ($PUBSPEC_VERSION)"
            exit 1
          fi
          echo "Version match confirmed: $TAG_VERSION"

  test:
    name: Test
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env files
        run: |
          cp .env.example .env
          cp .env.example assets/.env
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool/
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter=github

  build-android:
    name: Build Android (Production)
    needs: [validate-tag, test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.validate-tag.outputs.version }}
      build_number: ${{ needs.validate-tag.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env files
        run: |
          cp .env.example .env
          cp .env.example assets/.env
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool/
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - run: flutter pub get

      - name: Decode Android Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
      - name: Decode Key Properties
        run: echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" | base64 --decode > android/key.properties

      - name: Build Signed APK
        run: |
          flutter build apk --release \
            --build-number=${{ needs.validate-tag.outputs.build_number || github.run_number }} \
            --dart-define=SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.PROD_SUPABASE_ANON_KEY }}" \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --dart-define=POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}" \
            --dart-define=POSTHOG_HOST="${{ secrets.POSTHOG_HOST || 'https://app.posthog.com' }}" \
            --dart-define=MAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}"

      - name: Build Signed AAB
        run: |
          flutter build appbundle --release \
            --build-number=${{ needs.validate-tag.outputs.build_number || github.run_number }} \
            --dart-define=SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.PROD_SUPABASE_ANON_KEY }}" \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --dart-define=POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}" \
            --dart-define=POSTHOG_HOST="${{ secrets.POSTHOG_HOST || 'https://app.posthog.com' }}" \
            --dart-define=MAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}"

      - uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.ref_name }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-ios:
    name: Build iOS (Production)
    needs: [validate-tag, test]
    runs-on: macos-latest
    outputs:
      version: ${{ needs.validate-tag.outputs.version }}
      build_number: ${{ needs.validate-tag.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env files
        run: |
          cp .env.example .env
          cp .env.example assets/.env
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool/
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - run: flutter pub get
      - name: Decode iOS signing certificate
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > /tmp/certificate.p12
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Build iOS IPA
        run: |
          flutter build ios --release \
            --build-number=${{ needs.validate-tag.outputs.build_number || github.run_number }} \
            --dart-define=SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.PROD_SUPABASE_ANON_KEY }}" \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --dart-define=POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}" \
            --dart-define=POSTHOG_HOST="${{ secrets.POSTHOG_HOST || 'https://app.posthog.com' }}" \
            --dart-define=MAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}"
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -archivePath build/Runner.xcarchive archive
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/output
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.ref_name }}
          path: build/output/Runner.ipa
          retention-days: 30

  db-migration:
    name: Database Migration Check
    needs: validate-tag
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Check for pending migrations
        run: |
          echo "Verify no pending SQL migration files in supabase/migrations/"
          echo "Run manually: supabase db push --project-id YOUR_PROJECT_ID"
          echo "Or apply SQL files in Supabase SQL Editor before tagging release."

  publish-github-release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-release-${{ github.ref_name }}
          path: release-artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release-artifacts/app-release.apk
            release-artifacts/app-release.aab

  upload-to-supabase:
    name: Upload APK to Supabase Storage
    needs: build-android
    if: needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-release-${{ github.ref_name }}
          path: release-artifacts
          merge-multiple: true
      - name: Upload APK to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -e
          echo "Uploading APK to Supabase Storage..."
          curl -X POST "${SUPABASE_URL}/storage/v1/object/app-updates/apk/microflow-latest.apk" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary @release-artifacts/app-release.apk
          echo "Updating system_config with version ${VERSION}..."
          curl -X PATCH "${SUPABASE_URL}/rest/v1/system_config?id=eq.1" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"current_version_android\": \"${VERSION}\", \"update_url_android\": \"${SUPABASE_URL}/storage/v1/object/public/app-updates/apk/microflow-latest.apk\"}"
          echo "Supabase upload complete."
