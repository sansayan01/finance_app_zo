name: microflow_pro
description: "MicroFlow Pro - Premium Micro-Finance Management Ecosystem"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.0

  # Local Database (Offline Storage)
  hive_flutter: ^1.1.0

  # Network
  internet_connection_checker: ^1.0.0
  cached_network_image: ^3.4.1

  # UI/Design
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  connectivity_plus: ^6.1.1
  http: ^1.6.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  qr_flutter: ^4.1.0
  url_launcher: 6.3.1
  local_auth: ^3.0.1
  geolocator: 12.0.0
  battery_plus: ^6.2.0
  equatable: ^2.0.8
  share_plus: ^12.0.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  file_picker: ^8.1.2
  dio: ^5.7.0
  open_filex: ^4.5.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

  # Telemetry & Analytics
  sentry_flutter: ^8.12.1
  posthog_flutter: ^4.11.0
  package_info_plus: ^9.0.1
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # Mapbox
  mapbox_maps_flutter: ^2.7.0

  # Statement generation
  pdf: ^3.11.1
  printing: ^5.13.3
  csv: ^6.0.0
  excel: ^4.0.6
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_driver:
    sdk: flutter

  # Testing Utilities
  mocktail: ^1.0.4

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.8.0

  # Integration Testing
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/icons/