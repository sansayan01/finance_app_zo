name: 'Setup Flutter Environment'
description: 'Install Flutter, Java (optional), Gradle heap, and pub cache'

inputs:
  flutter-version:
    description: 'Flutter version to install'
    default: '3.44.x'
  java-version:
    description: 'Java version (only used if setup-java is true)'
    default: '17'
  setup-java:
    description: 'Whether to set up Java and Gradle'
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Prepare .env files
      shell: bash
      run: |
        if [ -f .env.example ]; then
          cp .env.example .env
          cp .env.example assets/.env
        fi

    - name: Set up Java ${{ inputs.java-version }}
      if: inputs.setup-java == 'true'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Set up Flutter ${{ inputs.flutter-version }}
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable

    - name: Cache pub dependencies
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.PUB_CACHE }}
          .dart_tool/
        key: pub-${{ hashFiles('pubspec.lock') }}
        restore-keys: pub-

    - name: Install dependencies
      shell: bash
      run: flutter pub get

    - name: Increase Gradle heap for CI
      if: inputs.setup-java == 'true'
      shell: bash
      run: sed -i 's/-Xmx[0-9]*G/-Xmx6G/' android/gradle.properties
