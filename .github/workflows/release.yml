name: Production Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.x'
  JAVA_TOOL_OPTIONS: '-Xmx4096m'

jobs:
  merge-to-main:
    name: Merge Development → Main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge development into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin development
          git merge origin/development --no-edit -m "chore: merge development into main for release"
          git push origin main
          echo "✅ Merged development → main successfully"

  validate-tag:
    name: Validate Tag
    needs: merge-to-main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      build_number: ${{ steps.extract.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract version from tag
        id: extract
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Build version: $TAG"
          if [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\+([0-9]+)$ ]]; then
            echo "build_number=${BASH_REMATCH[4]}" >> "$GITHUB_OUTPUT"
            echo "Build number: ${BASH_REMATCH[4]}"
          else
            echo "WARNING: Tag doesn't match version+build format (x.y.z+N)"
          fi
      - name: Verify version matches pubspec.yaml
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PUBSPEC_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match pubspec.yaml version ($PUBSPEC_VERSION)"
            exit 1
          fi
          echo "Version match confirmed: $TAG_VERSION"

  test:
    name: Test
    needs: merge-to-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare .env files
        run: |
          cp .env.example .env
          cp .env.example assets/.env
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool/
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter=github

  build-android:
    name: Build Android (Production)
    needs: [validate-tag, test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.validate-tag.outputs.version }}
      build_number: ${{ needs.validate-tag.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare .env files
        run: |
          cp .env.example .env
          cp .env.example assets/.env
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool/
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - run: flutter pub get

      - name: Increase Gradle heap for CI
        run: sed -i 's/-Xmx[0-9]*G/-Xmx6G/' android/gradle.properties

      - name: Decode Android Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
      - name: Decode Key Properties
        run: echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" | base64 --decode > android/key.properties

      - name: Build Signed APK (Universal)
        run: |
          flutter build apk --release \
            --build-number=${{ needs.validate-tag.outputs.build_number || github.run_number }} \
            --dart-define=SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.PROD_SUPABASE_ANON_KEY }}" \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --dart-define=POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}" \
            --dart-define=POSTHOG_HOST="${{ secrets.POSTHOG_HOST || 'https://app.posthog.com' }}" \
            --dart-define=MAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      - name: Build Split APKs (per architecture)
        run: |
          flutter build apk --release --split-per-abi \
            --build-number=${{ needs.validate-tag.outputs.build_number || github.run_number }} \
            --dart-define=SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.PROD_SUPABASE_ANON_KEY }}" \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --dart-define=POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}" \
            --dart-define=POSTHOG_HOST="${{ secrets.POSTHOG_HOST || 'https://app.posthog.com' }}" \
            --dart-define=MAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      - name: Build Signed AAB
        run: |
          flutter build appbundle --release \
            --build-number=${{ needs.validate-tag.outputs.build_number || github.run_number }} \
            --dart-define=SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.PROD_SUPABASE_ANON_KEY }}" \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --dart-define=POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}" \
            --dart-define=POSTHOG_HOST="${{ secrets.POSTHOG_HOST || 'https://app.posthog.com' }}" \
            --dart-define=MAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      - name: Prepare flat artifacts
        run: |
          mkdir -p build-artifacts
          # Universal APK (all architectures)
          cp build/app/outputs/flutter-apk/app-release.apk build-artifacts/
          # Split APKs (one per architecture)
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build-artifacts/ 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build-artifacts/ 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build-artifacts/ 2>/dev/null || true
          # AAB for Play Store
          cp build/app/outputs/bundle/release/app-release.aab build-artifacts/
          echo "Artifacts prepared:"
          ls -la build-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.ref_name }}
          path: build-artifacts/
          retention-days: 30

  deploy-web:
    name: Deploy Web (Production)
    needs: [validate-tag, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool/
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-
      - run: flutter pub get
      - name: Build Web (Production)
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.PROD_SUPABASE_ANON_KEY }}" \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --dart-define=POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}" \
            --dart-define=POSTHOG_HOST="${{ secrets.POSTHOG_HOST || 'https://app.posthog.com' }}" \
            --dart-define=MAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}" \
            --dart-define=GOOGLE_REDIRECT_URI="https://microflow-442f8.web.app/"
      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseToken: ${{ secrets.FIREBASE_TOKEN }}
          projectId: microflow-442f8
          channelId: live
          entryPoint: ./

  db-migration:
    name: Database Migration Check
    needs: validate-tag
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check for pending migrations
        run: |
          echo "Verify no pending SQL migration files in supabase/migrations/"
          echo "Run manually: supabase db push --project-id YOUR_PROJECT_ID"
          echo "Or apply SQL files in Supabase SQL Editor before tagging release."

  publish-github-release:
    name: Create GitHub Release
    needs: [build-android]
    if: always() && (needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-release-${{ github.ref_name }}
          path: release-artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          make_latest: true
          files: |
            release-artifacts/app-release.apk
            release-artifacts/app-arm64-v8a-release.apk
            release-artifacts/app-armeabi-v7a-release.apk
            release-artifacts/app-x86_64-release.apk
            release-artifacts/app-release.aab
      - name: Remove auto-generated source archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq '.id')
          if [ -n "$RELEASE_ID" ]; then
            ASSETS=$(gh api repos/${{ github.repository }}/releases/$RELEASE_ID/assets --jq '.[] | select(.name | test("\\.(zip|tar\\.gz)$")) | .id')
            for ASSET_ID in $ASSETS; do
              ASSET_NAME=$(gh api repos/${{ github.repository }}/releases/$RELEASE_ID/assets/$ASSET_ID --jq '.name')
              echo "Removing auto-generated asset: $ASSET_NAME"
              gh api -X DELETE repos/${{ github.repository }}/releases/$RELEASE_ID/assets/$ASSET_ID
            done
          fi
